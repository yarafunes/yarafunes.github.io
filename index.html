:root {
  --paper: #F3F1EA;
  --surface: #FBFAF5;
  --ink: #1A1C16;
  --ink-soft: #55574C;
  --ink-faint: #666858;
  --rule: #DFDCD0;
  --accent: #35663F;
  --accent-ink: #2A5333;
  --accent-wash: #E0E8DC;
  --on-accent: #FBFAF5;
  --spark: #8B7246;
  --spark-ink: #7A6339;
  --action: #681F21;
  --on-action: #F6EFEA;
  --panel: #681F21;
  --panel-ink: #F6EFEA;
  --panel-soft: #D9BDBB;
  --focus: #35663F;

  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --measure: none;
  --page: 700px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1614;
    --surface: #141F1D;
    --ink: #E7EEEB;
    --ink-soft: #A7B8B3;
    --ink-faint: #8A9A94;
    --rule: #26332F;
    --accent: #87C48F;
    --accent-ink: #A5D8AC;
    --accent-wash: #1E2A1C;
    --on-accent: #08110F;
    --spark: #D9B27A;
    --spark-ink: #D9B27A;
    --action: #C9737C;
    --on-action: #230C0E;
    --panel: #5A2023;
    --panel-ink: #F2E6E4;
    --panel-soft: #D2AEAB;
    --focus: #74C3AE;
  }
}

:root[data-theme="dark"] {
  --paper: #0D1614;
  --surface: #141F1D;
  --ink: #E7EEEB;
  --ink-soft: #A7B8B3;
  --ink-faint: #8A9A94;
  --rule: #26332F;
  --accent: #87C48F;
  --accent-ink: #A5D8AC;
  --accent-wash: #1E2A1C;
  --on-accent: #08110F;
  --spark: #D9B27A;
  --spark-ink: #D9B27A;
  --action: #C9737C;
  --on-action: #230C0E;
  --panel: #5A2023;
  --panel-ink: #F2E6E4;
  --panel-soft: #D2AEAB;
  --focus: #74C3AE;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 20px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.panel :focus-visible { outline-color: var(--panel-ink); }

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  background: var(--action);
  color: var(--on-action);
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.75rem 1.1rem;
  text-decoration: none;
}

.skip:focus { left: 0.75rem; top: 0.75rem; }

b, strong { font-weight: 600; color: var(--accent); }
.panel b, .panel strong { color: #FFFFFF; }

/* ---------- nav ---------- */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}

.nav-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 0.45rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-ink);
  text-decoration: none;
  white-space: nowrap;
}

.nav-links { display: flex; gap: 1.5rem; }

.nav-links a {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  text-decoration: none;
  white-space: nowrap;
  transition: color 150ms ease;
}

.nav-links a:hover { color: var(--ink); }

.nav-links a {
  position: relative;
  border-bottom: 2px solid transparent;
}

.nav-links a[aria-current="true"] {
  color: var(--ink);
  border-bottom-color: var(--spark);
}

.nav-right { display: flex; align-items: center; gap: 0.75rem; }

.langs {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 2px;
  overflow: hidden;
  background: var(--surface);
}

.langs button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  min-height: 36px;
  padding: 0 0.7rem;
  cursor: pointer;
  transition: color 120ms ease, background-color 120ms ease;
}

.langs button + button { border-left: 1px solid var(--rule); }
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.nav-cta {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
  border: 1px solid var(--action);
  padding: 0 0.9rem;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 150ms ease, color 150ms ease;
}

.nav-cta:hover { background: var(--action); color: var(--on-action); }

.nav-inner .nav-links { display: none; }

.nav-scroll {
  display: block;
  border-top: 1px solid var(--rule);
}

.nav-scroll .nav-links {
  max-width: var(--page);
  margin: 0 auto;
  padding: 0 1.5rem;
  gap: 0.5rem;
  justify-content: space-between;
}

.nav-scroll .nav-links a { min-height: 40px; }

/* ---------- page ---------- */

.page { max-width: var(--page); margin: 0 auto; padding: 0 1.5rem 5rem; }

.block {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  gap: 2rem;
  padding: 3.25rem 0;
  border-top: 1px solid var(--rule);
  scroll-margin-top: 7rem;
}

.block:first-of-type { border-top: 0; padding-top: 3rem; }

h2 { margin: 0; font-size: inherit; font-weight: inherit; }

.rail {
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--spark-ink);
  padding-top: 0.45rem;
  line-height: 1.6;
  margin: 0;
}

.rail::before {
  content: "";
  display: block;
  width: 26px;
  height: 3px;
  background: var(--spark);
  margin-bottom: 0.9rem;
}

.portrait {
  display: block;
  width: 118px;
  height: 118px;
  object-fit: cover;
  border: 1px solid var(--rule);
  margin-bottom: 1.4rem;
}

.rail-col .rail { padding-top: 0; }

.body { max-width: var(--measure); }
.body-wide { max-width: none; }

/* ---------- masthead ---------- */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 2.4rem;
  margin: 0 0 3rem;
  padding: 0.85rem 0 0;
  border-top: 1px solid var(--rule);
  list-style: none;
}

.tags li {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--spark-ink);
}

h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(3.4rem, 10vw, 7rem);
  line-height: 0.92;
  letter-spacing: -0.025em;
  margin: 0 0 2.25rem;
}

h1 .surname { font-style: italic; color: var(--accent); }

.hero-cols { display: block; }

.lead {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(1.3rem, 5.2vw, 1.65rem);
  line-height: 1.32;
  color: var(--ink);
  margin: 0 0 1.5rem;
  text-wrap: balance;
}

.lead-a { margin-bottom: 0.1em; }

.lead .hi { color: var(--accent); background: var(--accent-wash); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 0.1em; }

.lead-sub { font-size: 1.08rem; line-height: 1.6; color: var(--ink); margin: 0 0 1.9rem; }

.lead-body { font-size: 1rem; line-height: 1.65; color: var(--ink-soft); margin: 0 0 0.9rem; }

.lead-now {
  font-family: var(--mono);
  font-size: 0.68rem;
  line-height: 1.7;
  color: var(--ink-faint);
  margin: 1.25rem 0 0;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
}

.lead-now b { color: var(--accent-ink); font-weight: 400; }

/* ---------- shared ---------- */

.statement {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(1.25rem, 2.4vw, 1.7rem);
  line-height: 1.35;
  color: var(--ink);
  margin: 0 0 1.75rem;
  max-width: 46ch;
  text-wrap: balance;
}

h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.12rem;
  line-height: 1.3;
  margin: 0 0 0.6rem;
  color: var(--ink);
}

p { margin: 0 0 1rem; }
p:last-child { margin-bottom: 0; }

.muted { color: var(--ink-soft); }

/* ---------- card grids ---------- */

.grid { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.grid-3 {
  display: block;
  background: none;
  border: 0;
}

.grid-3 .cell {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 1.5rem;
  align-items: baseline;
  background: none;
  border: 0;
  border-top: 1px solid var(--rule);
  padding: 1.1rem 0;
}

.grid-3 .cell:hover { background: none; }
.grid-3 .cell h3 { margin: 0; }
.grid-3 .cell .claim { margin: 0; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.cell {
  background: var(--paper);
  padding: 1.6rem 1.5rem;
  border-top: 3px solid transparent;
  transition: background-color 200ms ease, border-color 200ms ease;
}

.cell:hover { background: var(--surface); border-top-color: var(--accent); }

.cell .cat {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--spark-ink);
  margin-bottom: 0.9rem;
}

.cell .claim {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 1.02rem;
  line-height: 1.45;
  color: var(--accent);
  margin: 0 0 0.9rem;
}

.cell p:not(.claim) { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; margin: 0 0 0.7rem; }

.cell p.close { margin-top: auto; padding-top: 1rem; margin-bottom: 0; color: var(--ink); }

/* ---------- programmes ---------- */

.programmes { display: flex; flex-direction: column; gap: 3.25rem; }

.prog { border-top: 2px solid var(--accent); padding-top: 1.5rem; }

.prog .cat {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--spark-ink);
  margin-bottom: 0.8rem;
}

.prog h3 { font-size: 1.45rem; margin-bottom: 0.7rem; }

.prog-lead { font-size: 1rem; line-height: 1.6; color: var(--ink-soft); margin: 0; max-width: var(--measure); }

.phases {
  list-style: none;
  margin: 1.6rem 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}

.phases-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.phases li { background: var(--paper); padding: 1.1rem 1.1rem 1.2rem; }

.ph-n {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  color: var(--spark-ink);
  margin-bottom: 0.5rem;
}

.ph-h {
  display: block;
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.35;
  color: var(--ink);
  margin-bottom: 0.35rem;
}

.phases p { font-size: 0.95rem; line-height: 1.55; color: var(--ink-soft); margin: 0; }

.prog-out {
  margin: 1.4rem 0 0;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--ink);
  max-width: var(--measure);
}

/* ---------- timeline ---------- */

.path { display: flex; flex-direction: column; gap: 2.5rem; max-width: var(--measure); }

.when {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--spark-ink);
  margin-bottom: 1rem;
}

.stop p { color: var(--ink-soft); font-size: 1rem; }

/* ---------- lists ---------- */

.two-col { display: block; }

ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.8rem; }

ul.plain li {
  color: var(--ink-soft);
  font-size: 1rem;
  line-height: 1.55;
  padding-left: 1.1rem;
  position: relative;
}

ul.plain li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.6em;
  width: 5px;
  height: 5px;
  background: var(--accent);
}

ul.plain li .inst {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--ink-faint);
  margin-top: 0.15rem;
}

.after-list {
  max-width: var(--measure);
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule);
  color: var(--ink-soft);
  font-size: 1rem;
}

/* ---------- methods ---------- */

.methods {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0 2rem;
  align-items: start;
}

.methods .cell {
  background: none;
  border: 0;
  border-left: 1px solid var(--rule);
  padding: 0 0 0 1.5rem;
}

.methods .cell:first-child { border-left: 0; padding-left: 0; }
.methods .cell:hover { background: none; }

/* stacked methods inside the education block */

.methods-stack {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.5rem 2rem;
  margin-top: 2.5rem;
  padding-top: 1.75rem;
  border-top: 1px solid var(--rule);
}
.methods-stack .cell { background: none; border: 0; padding: 0; }
.methods-stack .cell:hover { background: none; }
.methods-stack .cat { margin-bottom: 0.45rem; }

/* figures strip */

.figs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 1.6rem 0 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.figs-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.fig { padding: 1rem 0.9rem; border-left: 1px solid var(--rule); }
.fig:first-child { border-left: 0; padding-left: 0; }

.fig .n {
  display: block;
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(1.7rem, 3vw, 2.15rem);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.fig .u {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--spark-ink);
  margin-top: 0.5rem;
}

/* four-layer breakdown */

.role { margin: 1.5rem 0 0; }
.role p { font-size: 1rem; line-height: 1.6; color: var(--ink); margin: 0; }

.layers { margin: 1.6rem 0 0; }

.lhead {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--spark-ink);
  margin-bottom: 0.7rem;
}

.layer {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 1.25rem;
  padding: 0.85rem 0;
  border-top: 1px solid var(--rule);
}

.layer .ly-h { font-weight: 600; font-size: 0.95rem; color: var(--ink); }
.layer p { font-size: 0.95rem; line-height: 1.55; color: var(--ink-soft); margin: 0; }

/* ---------- contact ---------- */

.panel { background: var(--panel); color: var(--panel-ink); padding: 3rem 2.5rem; }
.panel .muted { max-width: 54ch; }
.panel .statement { color: var(--panel-ink); }
.panel .muted { color: var(--panel-soft); }
.panel .cta {
  background: var(--panel-ink);
  color: var(--panel);
  box-shadow: none;
}
.panel .cta:hover { opacity: 0.9; }

.contact-grid { display: block; }

.contact-side { margin-top: 2.25rem; }

.cta {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--action);
  color: var(--on-action);
  font-family: var(--mono);
  font-size: 0.74rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.95rem 1.5rem;
  text-decoration: none;
  transition: opacity 150ms ease;
}

.cta:hover { opacity: 0.88; }

a { color: var(--accent-ink); text-underline-offset: 3px; }
.page p a:not([class]), .page li a:not([class]) { text-decoration: underline; text-decoration-thickness: 1px; }

footer {
  border-top: 1px solid var(--rule);
  padding: 1.75rem 0 0;
  margin-top: 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 2rem;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- responsive ---------- */

@media (max-width: 900px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 .cell { grid-template-columns: 1fr; gap: 0.3rem; }
  .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .methods { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; }
  .methods .cell:nth-child(3) { border-left: 0; padding-left: 0; }
  .methods-stack { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .block { scroll-margin-top: 8.5rem; }
  .nav-scroll .nav-links a { min-height: 44px; }
  .block { grid-template-columns: 1fr; gap: 1rem; padding: 2.5rem 0; }
  .rail { padding-top: 0; }
  .phases { grid-template-columns: 1fr; }
  .methods { grid-template-columns: 1fr; gap: 1.75rem; }
  .methods .cell { border-left: 0; padding-left: 0; }
  .rail-col { display: flex; align-items: center; gap: 1rem; }
  .portrait { width: 72px; height: 72px; margin-bottom: 0; flex: none; }
  .rail-col .rail::before { margin-bottom: 0.55rem; }
  .masthead { display: flex; flex-direction: column; }
  .masthead h1 { order: 1; }
  .masthead .hero-cols { order: 2; }
  .masthead .tags { order: 3; margin: 2.5rem 0 0; }
  .tags li { font-size: 0.62rem; letter-spacing: 0.12em; }
  .tags { gap: 0.35rem 1.5rem; }
  h1 { margin-bottom: 1.75rem; }
  .layer { grid-template-columns: 1fr; gap: 0.25rem; }
  .prog h3 { font-size: 1.3rem; }
  .panel { padding: 2rem 1.5rem; }
  .panel .statement { max-width: none; }
}

@media (max-width: 560px) {
  .tags { flex-direction: column; gap: 0.3rem; }
  .fig { padding: 0.9rem 0.8rem; }
  .fig .u { font-size: 0.6rem; letter-spacing: 0.08em; margin-top: 0.4rem; }
}

@media (max-width: 480px) {
  .nav-inner { padding: 0.45rem 1rem; gap: 0.6rem; }
  .brand { font-size: 0.62rem; letter-spacing: 0.14em; }

}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}

  var textNodes = document.querySelectorAll("[data-i18n]");
  var htmlNodes = document.querySelectorAll("[data-i18n-html]");
  var buttons = document.querySelectorAll(".langs button");

  function apply(lang) {
    var table = dict[lang] || dict.es;
    textNodes.forEach(function (node) {
      var key = node.getAttribute("data-i18n");
      if (table[key]) { node.textContent = table[key]; }
    });
    htmlNodes.forEach(function (node) {
      var key = node.getAttribute("data-i18n-html");
      if (table[key]) { node.innerHTML = table[key]; }
    });
    document.documentElement.setAttribute("lang", lang);
    if (table["meta.title"]) { document.title = table["meta.title"]; }
    if (table["meta.desc"]) {
      ["meta[name='description']", "meta[property='og:description']"].forEach(function (sel) {
        var m = document.querySelector(sel);
        if (m) { m.setAttribute("content", table["meta.desc"]); }
      });
      var ogt = document.querySelector("meta[property='og:title']");
      if (ogt && table["meta.title"]) { ogt.setAttribute("content", table["meta.title"]); }
    }
    buttons.forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    try { localStorage.setItem("yf-lang", lang); } catch (e) {}
  }

  function detect() {
    try {
      var saved = localStorage.getItem("yf-lang");
      if (saved && dict[saved]) { return saved; }
    } catch (e) {}
    var prefs = navigator.languages || [navigator.language || "es"];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).slice(0, 2).toLowerCase();
      if (dict[code]) { return code; }
    }
    return "es";
  }

  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () { apply(btn.getAttribute("data-lang")); });
  });

  apply(detect());

  // active section indicator
  var sections = ["work", "programmes", "background", "contact"]
    .map(function (id) { return document.getElementById(id); })
    .filter(Boolean);
  var navLinks = document.querySelectorAll('.nav-links a[href^="#"]');

  function mark(id) {
    navLinks.forEach(function (a) {
      if (a.getAttribute("href") === "#" + id) { a.setAttribute("aria-current", "true"); }
      else { a.removeAttribute("aria-current"); }
    });
  }

  if ("IntersectionObserver" in window && sections.length) {
    var seen = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { seen[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0; });
      var best = null, top = 0;
      sections.forEach(function (s) {
        if ((seen[s.id] || 0) > top) { top = seen[s.id]; best = s.id; }
      });
      if (best) { mark(best); } else { mark(""); }
    }, { rootMargin: "-45% 0px -45% 0px", threshold: [0, 0.01, 0.5, 1] });
    sections.forEach(function (s) { io.observe(s); });
  }
})();
